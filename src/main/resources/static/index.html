<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Twin</title>
<style>
  :root { --bg:#ffffff; --side:#f4f4f5; --text:#18181b; --muted:#71717a; --border:#e4e4e7; --user:#f4f4f5; --accent:#18181b; --accent-text:#ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#18181b; --side:#111113; --text:#f4f4f5; --muted:#a1a1aa; --border:#27272a; --user:#27272a; --accent:#f4f4f5; --accent-text:#18181b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; font:15px/1.55 system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); }
  aside { width:260px; background:var(--side); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:12px; gap:8px; }
  aside button.new { padding:10px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); cursor:pointer; text-align:left; font:inherit; }
  #chats { overflow-y:auto; display:flex; flex-direction:column; gap:2px; }
  .chat { display:flex; align-items:center; border-radius:8px; padding:8px 10px; cursor:pointer; color:var(--text); }
  .chat:hover, .chat.active { background:var(--border); }
  .chat span { flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .chat button { visibility:hidden; border:0; background:none; color:var(--muted); cursor:pointer; font-size:16px; }
  .chat:hover button { visibility:visible; }
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #messages { flex:1; overflow-y:auto; padding:24px 16px; }
  .msg { max-width:760px; margin:0 auto 18px; white-space:pre-wrap; word-wrap:break-word; }
  .msg.user { background:var(--user); border-radius:16px; padding:10px 14px; width:fit-content; margin-right:max(16px, calc((100% - 760px) / 2)); }
  .msg.user { margin-left:auto; }
  .empty { color:var(--muted); text-align:center; margin-top:30vh; }
  form { display:flex; gap:8px; max-width:792px; width:100%; margin:0 auto; padding:16px; }
  textarea { flex:1; resize:none; padding:12px; border:1px solid var(--border); border-radius:12px; background:var(--bg); color:var(--text); font:inherit; max-height:200px; }
  form button { padding:0 18px; border:0; border-radius:12px; background:var(--accent); color:var(--accent-text); font:inherit; cursor:pointer; }
  form button:disabled { opacity:.4; cursor:default; }
  @media (max-width: 700px) { aside { display:none; } }
  .msg.assistant { white-space:normal; }
  .msg.assistant p { margin:0 0 10px; }
  .msg.assistant pre { background:var(--side); border:1px solid var(--border); border-radius:8px; padding:12px; overflow-x:auto; }
  .msg.assistant code { font:13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .msg.assistant :not(pre) > code { background:var(--user); padding:1px 5px; border-radius:4px; }
  .msg.assistant ul, .msg.assistant ol { padding-left:22px; margin:0 0 10px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
</head>
<body>
<aside>
  <button class="new" id="newChat">+ New chat</button>
  <div id="chats"></div>
</aside>
<main>
  <div id="messages"><div class="empty">Start a new chat</div></div>
  <form id="composer">
    <textarea id="input" rows="1" placeholder="Message AI Twin" autofocus></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</main>
<script>
  // One id per browser: the backend only returns chats that belong to it.
  const clientId = (() => {
    let id = null;
    try { id = localStorage.getItem('aiTwinClientId'); } catch (_) {}
    if (!id) { id = crypto.randomUUID(); try { localStorage.setItem('aiTwinClientId', id); } catch (_) {} }
    return id;
  })();
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch (_) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} },
  };
  let accessCode = store.get('aiTwinAccessCode') || '';

  // Every call carries the browser id and, if the server wants one, the access code.
  // A 401 means an access code is required: ask once, remember it, retry.
  async function api(path, opts = {}) {
    const headers = { 'X-Client-Id': clientId, 'Content-Type': 'application/json' };
    if (accessCode) headers['X-Access-Code'] = accessCode;
    const res = await fetch('/api/conversations' + path, { ...opts, headers });
    if (res.status === 401) {
      const code = prompt('This AI Twin is private. Enter the access code:');
      if (!code) return res;
      accessCode = code.trim();
      store.set('aiTwinAccessCode', accessCode);
      return api(path, opts);
    }
    return res;
  }

  async function errorText(res) {
    try { return (await res.json()).message || 'Something went wrong.'; } catch (_) { return 'Something went wrong.'; }
  }

  let currentId = new URLSearchParams(location.search).get('chat');
  const $ = (id) => document.getElementById(id);

  async function loadChats() {
    const listRes = await api('');
    if (!listRes.ok) return;
    const chats = await listRes.json();
    $('chats').replaceChildren(...chats.map(c => {
      const row = document.createElement('div');
      row.className = 'chat' + (c.id === currentId ? ' active' : '');
      const title = document.createElement('span');
      title.textContent = c.title;
      const del = document.createElement('button');
      del.textContent = '×';
      del.title = 'Delete chat';
      del.onclick = async (e) => {
        e.stopPropagation();
        await api('/' + c.id, { method: 'DELETE' });
        if (c.id === currentId) openChat(null);
        loadChats();
      };
      row.append(title, del);
      row.onclick = () => openChat(c.id);
      return row;
    }));
  }

  async function openChat(id) {
    currentId = id;
    history.replaceState(null, '', id ? '?chat=' + id : location.pathname);
    $('messages').replaceChildren();
    if (!id) { $('messages').innerHTML = '<div class="empty">Start a new chat</div>'; loadChats(); return; }
    const res = await api('/' + id + '/messages');
    if (!res.ok) return openChat(null);
    (await res.json()).forEach(m => addMessage(m.role, m.text));
    loadChats();
  }

  function addMessage(role, text) {
    $('messages').querySelector('.empty')?.remove();
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    render(div, role, text);
    $('messages').append(div);
    $('messages').scrollTop = $('messages').scrollHeight;
    return div;
  }

  // Assistant replies are Markdown; render it and strip anything unsafe. User text stays plain.
  function render(div, role, text) {
    if (role === 'assistant' && window.marked && window.DOMPurify) {
      div.innerHTML = DOMPurify.sanitize(marked.parse(text));
    } else {
      div.textContent = text;
    }
  }

  async function send(text) {
    if (!currentId) {
      const created = await api('', { method: 'POST' });
      if (!created.ok) { addMessage('assistant', await errorText(created)); return; }
      currentId = (await created.json()).id;
      history.replaceState(null, '', '?chat=' + currentId);
    }
    addMessage('user', text);
    const reply = addMessage('assistant', '…');
    $('send').disabled = true;

    const res = await api('/' + currentId + '/messages', { method: 'POST', body: JSON.stringify({ text }) });
    if (!res.ok) {
      reply.textContent = res.status === 400 ? 'Message is empty or too long (max 2000 characters).' : await errorText(res);
      $('send').disabled = false;
      return;
    }
    loadChats();
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '', answer = '';
    // Parse Server-Sent Events: blocks separated by a blank line, with "event:" and "data:" lines.
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let cut;
      while ((cut = buffer.indexOf('\n\n')) >= 0) {
        const block = buffer.slice(0, cut);
        buffer = buffer.slice(cut + 2);
        const event = (block.match(/^event:(.*)$/m) || [])[1]?.trim();
        const data = block.split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5)).join('\n');
        if (event === 'token') { answer += JSON.parse(data).text; render(reply, 'assistant', answer); }
        if (event === 'error') { reply.textContent = JSON.parse(data).message; }
        $('messages').scrollTop = $('messages').scrollHeight;
      }
    }
    $('send').disabled = false;
  }

  $('newChat').onclick = () => openChat(null);
  $('composer').onsubmit = (e) => {
    e.preventDefault();
    const text = $('input').value.trim();
    if (!text || $('send').disabled) return;
    $('input').value = '';
    send(text);
  };
  $('input').onkeydown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('composer').requestSubmit(); }
  };
  openChat(currentId);
</script>
</body>
</html>
