services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: ai-twin-pgvector
    environment:
      POSTGRES_DB: ai_twin
      POSTGRES_USER: ai_twin
      POSTGRES_PASSWORD: ai_twin
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
